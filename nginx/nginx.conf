worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" $request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting Zone (100 req/sec with burst buffer)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # =========================================================================
    # Upstream Backend Cluster — Least Connections Load Balancing
    # =========================================================================
    upstream backend_cluster {
        least_conn; # Distribute load to instances with fewest active connections
        server backend-1:3000 max_fails=3 fail_timeout=10s;
        server backend-2:3000 max_fails=3 fail_timeout=10s;
        server backend-3:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost apextrack.internal;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Load-Balancer "NGINX-Least-Conn-Mesh" always;

        # Static Asset Cache
        location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # API Reverse Proxy & Load Balancing
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_cluster;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Observability Headers
            add_header X-Backend-Server $upstream_addr always;
            add_header X-Response-Time $upstream_response_time always;
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # General Web Fallback
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
